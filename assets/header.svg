<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Powfu: AI undergrad working on reinforcement learning and verifiable AI agents">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="78%" cy="20%" r="65%"><stop offset="0" stop-color="#7aa2ff" stop-opacity=".22"/><stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#e6edf3"/><stop offset="1" stop-color="#a5c0ff"/></linearGradient>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,'DejaVu Sans',sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
      .b{animation:in 8s infinite both}
      .b1{animation-delay:0s}.b2{animation-delay:.6s}.b3{animation-delay:1.2s}.b4{animation-delay:1.8s}
      .l{stroke-dasharray:40;animation:dash 8s infinite both}
      .ok{animation:ok 8s infinite both;animation-delay:2.6s}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes in{0%{opacity:0;transform:translateY(8px)}6%,85%{opacity:1;transform:none}95%,100%{opacity:0}}
      @keyframes dash{0%{stroke-dashoffset:40}10%,100%{stroke-dashoffset:0}}
      @keyframes ok{0%{opacity:0}8%,70%{opacity:1}80%,100%{opacity:0}}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="20" fill="#0d1117"/>
  <rect width="1200" height="320" rx="20" fill="url(#g)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="64" y="72" class="mono" font-size="16" fill="#7aa2ff">$ whoami<tspan class="cur" fill="#e6edf3">▍</tspan></text>
  <text x="62" y="160" class="sans" font-size="78" font-weight="700" fill="url(#t)">Powfu</text>
  <text x="64" y="204" class="sans" font-size="20" fill="#c9d1d9">AI undergrad · reinforcement learning · verifiable AI agents</text>
  <text x="64" y="252" class="mono" font-size="16" fill="#8b949e">reward: evidence &gt; vibes</text>

  <g transform="translate(676 76)">
    <g class="b b1"><rect width="100" height="84" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="16" y="32" class="mono" font-size="15" fill="#e6edf3">input</text><text x="16" y="60" class="mono" font-size="13" fill="#8b949e">a3f9…</text></g>
    <path class="l" d="M102 42h24" stroke="#7aa2ff" stroke-width="2"/>
    <g class="b b2" transform="translate(126 0)"><rect width="100" height="84" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="16" y="32" class="mono" font-size="15" fill="#e6edf3">model</text><text x="16" y="60" class="mono" font-size="13" fill="#8b949e">7c21…</text></g>
    <path class="l" d="M228 42h24" stroke="#7aa2ff" stroke-width="2"/>
    <g class="b b3" transform="translate(252 0)"><rect width="100" height="84" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="16" y="32" class="mono" font-size="15" fill="#e6edf3">tool</text><text x="16" y="60" class="mono" font-size="13" fill="#8b949e">e04b…</text></g>
    <path class="l" d="M354 42h24" stroke="#7aa2ff" stroke-width="2"/>
    <g class="b b4" transform="translate(378 0)"><rect width="100" height="84" rx="12" fill="#161b22" stroke="#7aa2ff" stroke-width="2"/>
      <text x="16" y="32" class="mono" font-size="15" fill="#e6edf3">output</text><text x="16" y="60" class="mono" font-size="13" fill="#8b949e">59d2…</text></g>
    <g class="ok" transform="translate(0 116)">
      <rect width="478" height="44" rx="10" fill="#0f2a1a" stroke="#238636" stroke-width="1.5"/>
      <text x="18" y="28" class="mono" font-size="15" fill="#3fb950">✓ proofline verify · digest sealed · secrets redacted</text>
    </g>
  </g>
</svg>
